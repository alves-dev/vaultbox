[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultbox"
version = "0.2.0"
description = "Small stateless SOPS + age dotenv service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["vaultbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
